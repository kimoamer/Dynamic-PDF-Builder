[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-pdf-builder"
dynamic = ["version"]
description = "Generate beautifully designed PDF and fully editable DOCX documents from Markdown, JSON, or a fluent API"
authors = [
    { name = "Dynamic PDF Builder Contributors" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "reportlab>=4.0.0",
    "pydantic>=2.0.0",
    "markdown-it-py>=3.0.0",
    "pygments>=2.17.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.0",
    "latex2mathml>=3.76",
    "svglib>=1.5.0",
    "pyphen>=0.14",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    "python-docx>=1.1",
]

[project.optional-dependencies]
diagrams = ["playwright>=1.40"]
plotly   = ["plotly>=5.0", "kaleido>=0.2"]
pdf      = ["pikepdf>=8.0"]
qa       = ["pymupdf>=1.23"]          # visual QA (AGPL; optional)
qa-permissive = ["pypdfium2>=5.0"]    # visual QA without AGPL: PDFium (BSD-3/Apache-2.0); PyMuPDF wins when both
ranker   = ["lightgbm>=4.0"]          # optional learned candidate ranker (MIT); not in "all"
analyzer = ["pymupdf>=1.23"]          # tools/reference_analyzer only (AGPL; local dev tool, not in "all")
qrcode   = ["qrcode[pil]>=7.4"]
rtl      = ["arabic-reshaper>=3.0", "python-bidi>=0.6"]  # already in core; kept for compatibility
all      = ["dynamic-pdf-builder[diagrams,plotly,pdf,qrcode,rtl,qa]"]
dev      = ["pytest>=8.0", "pymupdf>=1.23", "pikepdf>=8.0", "ruff>=0.3", "mypy>=1.8"]

[tool.setuptools.dynamic]
version = {attr = "dynamic_pdf.__version__"}

[tool.setuptools.packages.find]
include = ["dynamic_pdf*"]

[tool.setuptools.package-data]
dynamic_pdf = ["fonts/bundled/*.ttf", "fonts/bundled/catalog.json", "fonts/bundled/LICENSES/*.txt", "design/approved_grammar.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.scripts]
dynamic-pdf = "dynamic_pdf.cli:main"
