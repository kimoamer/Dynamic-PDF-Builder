name: Word and Excel check

# Every theme as Microsoft Word itself lays it out, and every workbook as Microsoft Excel computes it,
# on a Windows runner with Microsoft 365 Apps.
# The contact sheets and report are committed to the branch word-check/<the branch that ran it>, never to
# that branch itself, so its pull request holds only the work.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/word-check.yml", "benchmarks/word/**", "dynamic_pdf/renderers/docx*.py",
            "dynamic_pdf/renderers/xlsx*.py", "dynamic_pdf/core/formulas.py"]

permissions:
  contents: write

jobs:
  word:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the library and pywin32
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[xlsx]" pywin32 pymupdf
      - name: Install Microsoft 365 Apps (Word and Excel), from Microsoft's own installer
        run: |
          choco install office365business -y --no-progress --params "'/exclude:Access Groove Lync OneDrive OneNote Outlook PowerPoint Publisher Teams'"
          # no first-run screens or licence prompts for a document opened by a program
          reg add "HKCU\Software\Microsoft\Office\16.0\Registration" /v AcceptAllEulas /t REG_DWORD /d 1 /f
          reg add "HKCU\Software\Microsoft\Office\16.0\Common\General" /v ShownFirstRunOptin /t REG_DWORD /d 1 /f
          reg add "HKCU\Software\Microsoft\Office\16.0\Common\General" /v FirstRunCompleted /t REG_DWORD /d 1 /f
          reg add "HKCU\Software\Microsoft\Office\16.0\Word\Options" /v DisableBootToOfficeStart /t REG_DWORD /d 1 /f
          reg add "HKCU\Software\Microsoft\Office\16.0\Common\Privacy" /v DisconnectedState /t REG_DWORD /d 2 /f
      - name: Build every theme (DOCX and our PDF) and the workbooks
        run: python -m benchmarks.word.check build word-check
      - name: Word lays out each document and saves it as PDF
        run: python -m benchmarks.word.check word word-check
      - name: Excel recalculates each workbook, compares it with ours, and saves it as PDF
        run: python -m benchmarks.word.check excel word-check
      - name: Contact sheets and report
        run: python -m benchmarks.word.check sheets word-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-check
          path: word-check
      - name: Commit the sheets and report to the results branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f word-check/*.png word-check/report.json word-check/word.json word-check/excel.json || true
          git commit -m "word-check: Word's layout of every theme and Excel's results for every workbook" || exit 0
          # the latest run's results replace the last ones; the branch that ran it is left as it is
          git push --force origin "HEAD:refs/heads/word-check/${{ github.ref_name }}"
