name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly on the newest releases, without constraints.txt

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install LibreOffice (DOCX round-trip tests)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          # Ubuntu's mirrors time out at times: retry each download, and the whole install up to three times
          apt="sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            $apt update && $apt install -y --no-install-recommends libreoffice-writer libreoffice-math fonts-liberation && break
            [ "$attempt" = 3 ] && exit 1
            echo "install failed (attempt $attempt); retrying in 60 s"; sleep 60
          done
          mkdir -p ~/.fonts && find dynamic_pdf/fonts/bundled -name '*.ttf' -exec cp {} ~/.fonts/ \; && fc-cache -f
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,qrcode]" ${{ github.event_name != 'schedule' && '-c constraints.txt' || '' }}
      - name: Test
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Golden fixtures + page contact sheets
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m dynamic_pdf.qa.golden tests/fixtures tests/golden
          python -m dynamic_pdf.qa.golden tests/fixtures review --update --sheets
      - name: Evidence recipe comparison (PDF and LibreOffice-rendered DOCX)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python benchmarks/m74/run.py m74-comparison --jobs 2
      - name: Upload evidence recipe comparison
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: m74-comparison
          path: |
            m74-comparison/gallery
            m74-comparison/results.json
            m74-comparison/report.md
      - name: Layout archetype comparison (PDF and LibreOffice-rendered DOCX)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python benchmarks/m75/run.py m75-comparison
      - name: Upload layout archetype comparison
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: m75-comparison
          path: |
            m75-comparison/gallery
            m75-comparison/results.json
            m75-comparison/report.md
      - name: Media and page system comparison (PDF and LibreOffice-rendered DOCX)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python benchmarks/m76/run.py m76-comparison
      - name: Upload media and page system comparison
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: m76-comparison
          path: |
            m76-comparison/gallery
            m76-comparison/results.json
            m76-comparison/report.md
      - name: Automatic image placement comparison (PDF and LibreOffice-rendered DOCX)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python benchmarks/m78/run.py m78-comparison
      - name: Upload automatic image placement comparison
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: m78-comparison
          path: |
            m78-comparison/gallery
            m78-comparison/results.json
            m78-comparison/report.md
      - name: Scoreboard against its committed budgets (one corpus, every direction)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python benchmarks/scoreboard.py scoreboard --budgets benchmarks/scoreboard_baseline.json
      - name: Upload scoreboard
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard
          path: scoreboard
      - name: Upload contact sheets for visual review
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: page-contact-sheets
          path: review/sheets/*.png
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results.xml
